@let isSDKInitialized = isSDKInitializedSignal();
@let isIDTokenPayloadInitialized = isIDTokenPayloadInitializedSignal();

<div class="flex h-dvh flex-col justify-center gap-8">
  <div class="flex flex-col items-center gap-2">
    <button
      type="button"
      xRipple
      [disabled]="!isSDKInitialized"
      class="solid primary w-80"
      (click)="onAuthorizeButtonClicked()"
    >
      Request to authorize
    </button>
    <page-sign-form
      [isDisabled]="!isSDKInitialized || !isIDTokenPayloadInitialized"
      (submitted)="onSignFormSubmitted($event)"
    />
    <page-sign-eip712-typed-data-form
      [isDisabled]="!isSDKInitialized || !isIDTokenPayloadInitialized"
      (submitted)="onSignEIP712TypedDataFormSubmitted($event)"
    />
    <page-send-transaction-form
      [isDisabled]="!isSDKInitialized || !isIDTokenPayloadInitialized"
      (submitted)="onSendTransactionFormSubmitted($event)"
    />
    <button
      type="button"
      xRipple
      [disabled]="!isSDKInitialized || !isIDTokenPayloadInitialized"
      class="solid danger w-80"
      (click)="onDisconnectButtonClicked()"
    >
      Disconnect
    </button>
  </div>
  <div class="flex flex-col items-center">
    <button
      type="button"
      xRipple
      class="outlined primary w-80"
      (click)="onBackToHomeButtonClicked()"
    >
      <ng-icon name="heroChevronLeft" />
      <span class="grow">Back to Home</span>
      <div class="size-4"></div>
    </button>
  </div>
</div>
