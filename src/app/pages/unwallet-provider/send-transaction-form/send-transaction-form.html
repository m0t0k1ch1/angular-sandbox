@let isDisabled = isDisabledSignal();
@let label = labelSignal();
@let isOverlayVisible = isOverlayVisibleSignal();

<button
  type="button"
  xRipple
  [disabled]="isDisabled"
  class="solid primary w-80"
  (click)="onOpenDialogButtonClicked()"
>
  {{ label }}
</button>

<x-overlay [isVisible]="isOverlayVisible">
  <div class="max-h-4/5 w-4/5 max-w-96 overflow-y-auto rounded-lg bg-white">
    <form [formRoot]="form">
      <div class="flex flex-col gap-8 p-8">
        <div class="flex flex-col gap-4">
          <div class="flex flex-col gap-1">
            <div class="flex gap-1">
              <label for="to-address">To address</label>
              <span class="text-red-500">*</span>
            </div>
            <input id="to-address" type="text" xTextInput [formField]="form.toAddress" />
            <app-form-field-errors [state]="form.toAddress()" class="pl-1" />
          </div>
          <div class="flex flex-col gap-1">
            <label for="gas">Gas</label>
            <input id="gas" type="text" xTextInput [formField]="form.gas" />
            <app-form-field-errors [state]="form.gas()" class="pl-1" />
          </div>
          <div class="flex flex-col gap-1">
            <label for="gas-price">Gas price（wei）</label>
            <input id="gas-price" type="text" xTextInput [formField]="form.gasPrice" />
            <app-form-field-errors [state]="form.gasPrice()" class="pl-1" />
          </div>
          <div class="flex flex-col gap-1">
            <label for="value">Value</label>
            <input id="value" type="text" xTextInput [formField]="form.value" />
            <app-form-field-errors [state]="form.value()" class="pl-1" />
          </div>
          <div class="flex flex-col gap-1">
            <label for="data">Data</label>
            <input id="data" type="text" xTextInput [formField]="form.data" />
            <app-form-field-errors [state]="form.data()" class="pl-1" />
          </div>
        </div>
        <div class="flex justify-end gap-2">
          <button
            type="button"
            xRipple
            [disabled]="form().submitting()"
            class="solid secondary"
            (click)="onCancelButtonClicked()"
          >
            Cancel
          </button>
          <button type="submit" xRipple [disabled]="form().submitting()" class="solid primary">
            Submit
          </button>
        </div>
      </div>
    </form>
  </div>
</x-overlay>
